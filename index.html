<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07302E">
<title>Tracker — Task Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ground */
    --paper:#07302E;
    --paper-raised:#0C3D3A;
    --paper-sunk:#062A28;
    --ink:#FBEFE0;
    --ink-soft:#A3C0BC;
    --line:#14514D;
    --line-strong:#1D625E;

    /* palette */
    --brown-red:#972828;
    --terracotta:#E45742;
    --harvest:#EB7F31;
    --orange:#FCAD38;
    --teal:#007979;

    --accent:#EB7F31;
    --accent-deep:#E45742;
    --accent-soft:#3A2418;
    --rust:#F07A67;
    --rust-soft:#45201C;
    --sage:#FCAD38;
    --sage-soft:#3C2E14;
    --gold:#FCAD38;
    --gold-soft:#3C2E14;

    --r-lg:20px;
    --r-md:14px;
    --r-sm:10px;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.18), 0 2px 10px rgba(0,0,0,0.14);
    --shadow-md:0 4px 18px rgba(0,0,0,0.26);
    --shadow-lg:0 -12px 40px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); overflow-x:hidden; max-width:100vw;}
  body{
    font-family:'Figtree', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:110px;
    min-height:100vh;
    width:100%;
  }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  a{color:var(--accent-deep);}
  a:hover{color:var(--rust);}
  ::selection{background:var(--accent-soft); color:var(--ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  header{
    padding:24px 18px 14px;
    position:sticky; top:0; z-index:5;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  header .brand{display:flex; align-items:baseline; gap:9px;}
  header h1{
    margin:0;
    font-family:'Caprasimo', Georgia, serif;
    font-size:27px; font-weight:400; letter-spacing:0; line-height:1;
    color:var(--orange);
  }
  header .brand .pip{
    width:10px; height:10px; border-radius:50%;
    background:var(--terracotta); flex-shrink:0;
  }
  header .sub{
    font-size:13px; color:var(--ink-soft); margin-top:6px;
  }
  header .sub .count{color:var(--accent-deep); font-weight:700;}
  header .sub .od{color:var(--rust); font-weight:600;}

  .tabbar{
    display:flex; gap:7px; margin-top:14px;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:3px;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;
    display:flex; align-items:center; gap:7px;
    font-family:inherit; font-size:13px; font-weight:600;
    background:var(--paper-raised); border:1px solid var(--line); color:var(--ink-soft);
    padding:8px 15px; border-radius:999px; cursor:pointer;
    white-space:nowrap; transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .tab:hover{background:var(--paper-sunk); color:var(--ink);}
  .tab:active{background:var(--line);}
  .tab .tab-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .tab.active{border-color:var(--accent); color:var(--paper); background:var(--accent);}
  .tab.active:hover{background:var(--accent-deep); border-color:var(--accent-deep);}

  .toolbar{
    display:flex; gap:8px; padding:12px 18px 0;
  }
  .toolbar button{
    font-family:inherit; font-size:12.5px; font-weight:600;
    background:none; border:1px solid var(--line-strong); color:var(--ink-soft);
    padding:7px 14px; border-radius:999px; cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .toolbar button:hover{background:var(--paper-raised); color:var(--ink);}
  .toolbar button:active{background:var(--paper-sunk);}

  main{padding:16px 14px 0;}

  .section{
    margin-bottom:16px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    border-radius:var(--r-lg);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .section-head{
    display:flex; align-items:center; gap:12px;
    padding:15px 16px;
    cursor:pointer;
    user-select:none;
  }
  .dash{
    width:12px; height:12px; border-radius:50%; flex-shrink:0;
  }
  .section-head .titles{flex:1; min-width:0;}
  .section-head h2{
    margin:0; font-size:16px; font-weight:700; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .section-head .meta{
    font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-weight:500;
  }
  .chev{
    font-size:11px; color:var(--ink-soft);
    transition:transform .15s ease;
    flex-shrink:0;
  }
  .section.collapsed .chev{transform:rotate(-90deg);}

  .progress-track{
    height:5px; background:var(--paper-sunk); margin:0 16px; border-radius:999px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--accent); border-radius:999px;
    transition:width .25s ease;
  }

  .section-body{
    margin-top:13px;
    border-top:1px solid var(--line);
  }
  .section.collapsed .section-body{display:none;}
  .section.collapsed .progress-track{margin-bottom:14px;}

  .task{
    border-bottom:1px solid var(--line);
    padding:13px 16px;
  }
  .task:last-child{border-bottom:none;}
  .task-row{
    display:flex; align-items:flex-start; gap:12px;
  }
  .checkbox{
    width:22px; height:22px; border-radius:50%;
    border:2px solid var(--line-strong);
    flex-shrink:0; margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:var(--paper-raised);
    transition:background .14s ease, border-color .14s ease;
  }
  .checkbox:hover{border-color:var(--sage); background:var(--sage-soft);}
  .checkbox.done{background:var(--sage); border-color:var(--sage);}
  .checkbox.done::after{content:"✓"; color:var(--paper); font-size:13px; font-weight:700; line-height:1;}

  .task-main{flex:1; min-width:0;}
  .task-title{
    font-size:15px; font-weight:600; line-height:1.35;
    cursor:pointer; overflow-wrap:break-word; word-break:break-word;
  }
  .task.done .task-title{color:var(--ink-soft); font-weight:500; text-decoration:line-through; text-decoration-color:var(--line-strong);}

  .task-notes{
    font-size:12.5px; color:var(--ink-soft); line-height:1.4;
    margin-top:3px; cursor:pointer;
    overflow-wrap:break-word; word-break:break-word;
  }
  .task.done .task-notes{opacity:0.6;}

  .task-meta{
    display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap;
  }
  .deadline{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:var(--paper-sunk); color:var(--ink-soft);
  }
  .deadline.overdue{background:var(--rust-soft); color:var(--rust); font-weight:700;}
  .deadline.soon{background:var(--gold-soft); color:var(--gold); font-weight:700;}
  .priority-high{
    color:var(--rust); font-size:11px; font-weight:700;
    background:var(--rust-soft); padding:3px 9px; border-radius:999px;
  }
  .priority-med{
    color:var(--gold); font-size:11px; font-weight:600;
    background:var(--gold-soft); padding:3px 9px; border-radius:999px;
  }
  .sub-count{font-size:11px; color:var(--ink-soft); font-weight:500;}

  .task-actions{
    display:flex; gap:6px; flex-shrink:0;
  }
  .icon-btn{
    background:none; border:none; color:var(--ink-soft);
    font-size:15px; cursor:pointer; padding:3px 6px; line-height:1;
    border-radius:999px; transition:background .14s ease, color .14s ease;
  }
  .icon-btn:hover{background:var(--paper-sunk); color:var(--ink);}
  .icon-btn:active{color:var(--accent-deep);}

  .subtasks{margin:10px 0 0 4px;}
  .subtask{
    display:flex; align-items:center; gap:10px; padding:4px 0;
  }
  .subtask .checkbox{width:17px; height:17px; border-width:1.5px;}
  .subtask .checkbox.done::after{font-size:10px;}
  .subtask-title{font-size:13.5px; flex:1; overflow-wrap:break-word; word-break:break-word; min-width:0;}
  .subtask.done .subtask-title{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line-strong);}
  .subtask .icon-btn{font-size:14px;}

  .add-subtask{
    display:flex; gap:7px; margin:10px 0 0 4px;
  }
  .add-subtask input{
    flex:1; font-family:inherit; font-size:16px; color:var(--ink);
    border:1px solid var(--line); border-radius:999px; padding:7px 14px;
    background:var(--paper);
  }
  .add-subtask input::placeholder{color:var(--ink-soft);}
  .add-subtask button{
    font-family:inherit; font-size:12.5px; font-weight:600;
    border:1px solid var(--line-strong); background:none;
    border-radius:999px; padding:7px 14px; color:var(--ink-soft); cursor:pointer;
  }
  .add-subtask button:hover{background:var(--accent-soft); color:var(--accent-deep); border-color:var(--accent);}

  .add-task-row{padding:12px 16px 14px;}
  .add-task-row button{
    width:100%; text-align:left; font-family:inherit; font-weight:600;
    background:none; border:1.5px dashed var(--line-strong); color:var(--ink-soft);
    padding:11px 16px; border-radius:999px; font-size:13.5px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .add-task-row button:hover{border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft);}

  .empty{
    text-align:center; padding:64px 24px; color:var(--ink-soft);
  }
  .empty .ring{
    width:64px; height:64px; margin:0 auto 18px;
    border-radius:50%; background:var(--paper-sunk);
    border:2px dashed var(--line-strong);
  }
  .empty .big{
    font-family:'Caprasimo', Georgia, serif; font-weight:400;
    font-size:19px; color:var(--orange); margin-bottom:6px;
  }
  .empty .small{font-size:13.5px; line-height:1.5; max-width:34ch; margin:0 auto;}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(3,20,19,0.62);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
    overflow-x:hidden; width:100vw;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper); width:100%; max-width:480px; min-width:0;
    border-radius:26px 26px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto; overflow-x:hidden;
    box-shadow:var(--shadow-lg);
  }
  .sheet h3{
    margin:0 0 18px; font-size:19px; font-weight:400;
    font-family:'Caprasimo', Georgia, serif; color:var(--orange);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:11px; font-weight:700; color:var(--ink-soft);
    margin-bottom:6px; text-transform:uppercase; letter-spacing:0.06em;
  }
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%; font-family:inherit; font-size:16px;
    border:1px solid var(--line-strong); border-radius:var(--r-md); padding:11px 14px;
    background:var(--paper-raised); color:var(--ink);
  }
  .field input[type=text]::placeholder, .field textarea::placeholder{color:var(--ink-soft);}
  .field textarea{resize:vertical; min-height:70px;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{
    width:30px; height:30px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; box-shadow:0 0 0 1px rgba(251,239,224,0.15) inset;
  }
  .swatch.selected{border-color:var(--ink); box-shadow:none;}
  .prio-options{display:flex; gap:8px;}
  .prio-options button{
    flex:1; font-family:inherit; font-size:13px; font-weight:600; padding:10px;
    border:1px solid var(--line-strong); background:var(--paper-raised);
    border-radius:999px; color:var(--ink-soft); cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .prio-options button:hover{background:var(--paper-sunk);}
  .prio-options button.selected{border-color:var(--accent); color:var(--paper); background:var(--accent);}
  .sheet-actions{display:flex; gap:10px; margin-top:20px;}
  .sheet-actions button{
    flex:1; font-family:inherit; font-size:14.5px; font-weight:700;
    padding:13px; border-radius:999px; border:none; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--paper);}
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-secondary{background:none; border:1px solid var(--line-strong) !important; color:var(--ink-soft);}
  .btn-secondary:hover{background:var(--paper-raised); color:var(--ink);}
  .btn-danger{
    background:none; color:var(--rust); font-size:13px !important; font-weight:600 !important;
    padding:9px !important; border:none; border-radius:999px; cursor:pointer;
    width:100%; font-family:inherit;
  }
  .btn-danger:hover{background:var(--rust-soft);}

  .fab{
    position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:var(--paper);
    border:none; font-size:28px; font-weight:400; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 22px rgba(235,127,49,0.32);
    cursor:pointer; z-index:8;
    transition:background .14s ease, transform .14s ease;
  }
  .fab:hover{background:var(--accent-deep);}
  .fab:active{transform:scale(0.94);}

  input[type=file]{display:none;}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>Tracker</h1><span class="pip"></span></div>
  <div class="sub"><span class="count" id="statCount">0</span> open tasks · <span class="od" id="statOverdue">0</span> overdue</div>
  <nav class="tabbar" id="tabBar"></nav>
</header>

<div class="toolbar">
  <button id="exportBtn">Export backup</button>
  <button id="importBtn">Import backup</button>
  <input type="file" id="importFile" accept="application/json">
</div>

<main id="sections"></main>

<button class="fab" id="fabAdd" title="New module/goal">+</button>

<!-- Section modal -->
<div class="overlay" id="sectionOverlay">
  <div class="sheet">
    <h3 id="sectionModalTitle">New module / goal</h3>
    <div class="field">
      <label>Name</label>
      <input type="text" id="sectionName" placeholder="e.g. CS402 — Databases, or Fitness goals">
    </div>
    <div class="field">
      <label>Color tag</label>
      <div class="swatches" id="sectionSwatches"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="sectionCancel">Cancel</button>
      <button class="btn-primary" id="sectionSave">Save</button>
    </div>
    <button class="btn-danger" id="sectionDelete" style="display:none; margin-top:12px;">Delete this module and all its tasks</button>
  </div>
</div>

<!-- Task modal -->
<div class="overlay" id="taskOverlay">
  <div class="sheet">
    <h3 id="taskModalTitle">New task</h3>
    <div class="field">
      <label>Title</label>
      <input type="text" id="taskTitle" placeholder="What needs doing?">
    </div>
    <div class="field">
      <label>Deadline</label>
      <input type="date" id="taskDeadline">
    </div>
    <div class="field">
      <label>Priority</label>
      <div class="prio-options" id="taskPriority">
        <button data-p="low">Low</button>
        <button data-p="med">Medium</button>
        <button data-p="high">High</button>
      </div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="taskNotes" placeholder="Optional details..."></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="taskCancel">Cancel</button>
      <button class="btn-primary" id="taskSave">Save</button>
    </div>
    <button class="btn-danger" id="taskDelete" style="display:none; margin-top:12px;">Delete task</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'ledger_data_v1';
const SWATCH_COLORS = ['#E45742','#EB7F31','#FCAD38','#007979','#972828','#7A8A5E'];

let state = load();
let editingSectionId = null;
let editingTask = null; // {sectionId, taskId or null}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      parsed.activeTab = 'soon'; // app always opens on the Due Soon view
      return parsed;
    }
  }catch(e){}
  return { sections: [], activeTab: 'soon' };
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  render();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - today) / 86400000);
}
function formatDeadline(dateStr){
  const n = daysUntil(dateStr);
  if(n === null) return '';
  if(n < 0) return `${Math.abs(n)}d overdue`;
  if(n === 0) return 'Due today';
  if(n === 1) return 'Due tomorrow';
  if(n <= 7) return `Due in ${n}d`;
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function deadlineClass(dateStr){
  const n = daysUntil(dateStr);
  if(n === null) return '';
  if(n < 0) return 'overdue';
  if(n <= 3) return 'soon';
  return '';
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  if(state.sections.length === 0){
    bar.innerHTML = '';
    return;
  }
  const tabs = [{id:'soon', name:'Due Soon', color:null}, {id:'all', name:'All', color:null}, ...state.sections];
  bar.innerHTML = tabs.map(t => `
    <button class="tab ${state.activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">
      ${t.color ? `<span class="tab-dot" style="background:${t.color}"></span>` : ''}
      ${escapeHtml(t.name)}
    </button>
  `).join('');
  bar.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    });
  });
}

function render(){
  if(!['all','soon'].includes(state.activeTab) && !state.sections.some(s => s.id === state.activeTab)){
    state.activeTab = 'soon';
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  renderTabs();

  const container = document.getElementById('sections');
  container.innerHTML = '';

  const visibleSections = state.activeTab === 'soon'
    ? state.sections
        .map(sec => ({...sec, tasks: sec.tasks.filter(t => !t.done && t.deadline && daysUntil(t.deadline) <= 3)}))
        .filter(sec => sec.tasks.length > 0)
    : (state.activeTab === 'all'
        ? state.sections
        : state.sections.filter(s => s.id === state.activeTab));

  let openCount = 0, overdueCount = 0;
  visibleSections.forEach(sec => {
    sec.tasks.forEach(t => {
      if(!t.done){
        openCount++;
        if(daysUntil(t.deadline) !== null && daysUntil(t.deadline) < 0) overdueCount++;
      }
    });
  });
  document.getElementById('statCount').textContent = openCount;
  document.getElementById('statOverdue').textContent = overdueCount;

  if(state.sections.length === 0){
    container.innerHTML = `<div class="empty"><div class="ring"></div><div class="big">No modules yet</div><div class="small">Tap + to add your first module or goal.</div></div>`;
    return;
  }
  if(visibleSections.length === 0){
    const msg = state.activeTab === 'soon'
      ? `<div class="empty"><div class="ring"></div><div class="big">Nothing due soon</div><div class="small">You're clear for the next 3 days. Check the "All" tab to see everything else.</div></div>`
      : `<div class="empty"><div class="ring"></div><div class="big">Nothing here</div><div class="small">This module has no tasks yet.</div></div>`;
    container.innerHTML = msg;
    return;
  }

  visibleSections.forEach(sec => {
    const total = sec.tasks.length;
    const done = sec.tasks.filter(t=>t.done).length;
    const pct = total ? Math.round((done/total)*100) : 0;

    const secEl = document.createElement('div');
    secEl.className = 'section' + (sec.collapsed ? ' collapsed' : '');

    secEl.innerHTML = `
      <div class="section-head" data-sec="${sec.id}">
        <div class="dash" style="background:${sec.color}"></div>
        <div class="titles">
          <h2>${escapeHtml(sec.name)}</h2>
          <div class="meta">${done}/${total} done${total?` · ${pct}%`:''}</div>
        </div>
        <button class="icon-btn edit-sec" data-sec="${sec.id}">✎</button>
        <div class="chev">▾</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${sec.color}"></div></div>
      <div class="section-body">
        ${sec.tasks
          .slice()
          .sort((a,b)=>{
            if(a.done !== b.done) return a.done ? 1 : -1;
            const da = a.deadline ? new Date(a.deadline) : new Date('9999-12-31');
            const db = b.deadline ? new Date(b.deadline) : new Date('9999-12-31');
            return da - db;
          })
          .map(t => taskHtml(sec, t)).join('')}
        <div class="add-task-row">
          <button class="add-task-btn" data-sec="${sec.id}">+ Add task</button>
        </div>
      </div>
    `;
    container.appendChild(secEl);
  });

  attachHandlers();
}

function taskHtml(sec, t){
  const subDone = t.subtasks.filter(s=>s.done).length;
  const dClass = deadlineClass(t.deadline);
  return `
    <div class="task ${t.done ? 'done' : ''}" data-task="${t.id}" data-sec="${sec.id}">
      <div class="task-row">
        <div class="checkbox ${t.done ? 'done' : ''}" data-toggle-task="${t.id}" data-sec="${sec.id}"></div>
        <div class="task-main">
          <div class="task-title" data-edit-task="${t.id}" data-sec="${sec.id}">${escapeHtml(t.title)}</div>
          ${t.notes && t.notes.trim() ? `<div class="task-notes" data-edit-task="${t.id}" data-sec="${sec.id}">${escapeHtml(t.notes)}</div>` : ''}
          <div class="task-meta">
            ${t.deadline ? `<span class="deadline ${dClass} mono">${formatDeadline(t.deadline)}</span>` : ''}
            ${t.priority === 'high' ? '<span class="priority-high">High priority</span>' : ''}
            ${t.priority === 'med' ? '<span class="priority-med">Medium</span>' : ''}
            ${t.subtasks.length ? `<span class="mono sub-count">${subDone}/${t.subtasks.length} subtasks</span>` : ''}
          </div>
          <div class="subtasks">
            ${t.subtasks.map(s => `
              <div class="subtask ${s.done?'done':''}">
                <div class="checkbox ${s.done?'done':''}" data-toggle-sub="${s.id}" data-task="${t.id}" data-sec="${sec.id}"></div>
                <div class="subtask-title">${escapeHtml(s.title)}</div>
                <button class="icon-btn" data-del-sub="${s.id}" data-task="${t.id}" data-sec="${sec.id}">×</button>
              </div>
            `).join('')}
          </div>
          <div class="add-subtask">
            <input type="text" placeholder="Add subtask..." data-subinput="${t.id}">
            <button data-addsub="${t.id}" data-sec="${sec.id}">Add</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function attachHandlers(){
  document.querySelectorAll('.section-head').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.edit-sec')) return;
      const id = el.dataset.sec;
      const sec = state.sections.find(s=>s.id===id);
      sec.collapsed = !sec.collapsed;
      save();
    });
  });
  document.querySelectorAll('.edit-sec').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      openSectionModal(el.dataset.sec);
    });
  });
  document.querySelectorAll('[data-toggle-task]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sec = state.sections.find(s=>s.id===el.dataset.sec);
      const t = sec.tasks.find(t=>t.id===el.dataset.toggleTask);
      t.done = !t.done;
      save();
    });
  });
  document.querySelectorAll('[data-edit-task]').forEach(el=>{
    el.addEventListener('click', ()=>{
      openTaskModal(el.dataset.sec, el.dataset.editTask);
    });
  });
  document.querySelectorAll('[data-toggle-sub]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sec = state.sections.find(s=>s.id===el.dataset.sec);
      const t = sec.tasks.find(t=>t.id===el.dataset.task);
      const s = t.subtasks.find(s=>s.id===el.dataset.toggleSub);
      s.done = !s.done;
      save();
    });
  });
  document.querySelectorAll('[data-del-sub]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sec = state.sections.find(s=>s.id===el.dataset.sec);
      const t = sec.tasks.find(t=>t.id===el.dataset.task);
      t.subtasks = t.subtasks.filter(s=>s.id!==el.dataset.delSub);
      save();
    });
  });
  document.querySelectorAll('[data-addsub]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const input = document.querySelector(`[data-subinput="${el.dataset.addsub}"]`);
      const title = input.value.trim();
      if(!title) return;
      const sec = state.sections.find(s=>s.id===el.dataset.sec);
      const t = sec.tasks.find(t=>t.id===el.dataset.addsub);
      t.subtasks.push({id: uid(), title, done:false});
      save();
    });
  });
  document.querySelectorAll('[data-subinput]').forEach(el=>{
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        document.querySelector(`[data-addsub="${el.dataset.subinput}"]`).click();
      }
    });
  });
  document.querySelectorAll('.add-task-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      openTaskModal(el.dataset.sec, null);
    });
  });
}

// ---- Section modal ----
function openSectionModal(id){
  editingSectionId = id;
  const overlay = document.getElementById('sectionOverlay');
  const nameInput = document.getElementById('sectionName');
  const swatches = document.getElementById('sectionSwatches');
  const deleteBtn = document.getElementById('sectionDelete');
  swatches.innerHTML = SWATCH_COLORS.map(c=>`<div class="swatch" data-color="${c}" style="background:${c}"></div>`).join('');

  let selectedColor = SWATCH_COLORS[0];
  if(id){
    const sec = state.sections.find(s=>s.id===id);
    nameInput.value = sec.name;
    selectedColor = sec.color;
    deleteBtn.style.display = 'block';
    document.getElementById('sectionModalTitle').textContent = 'Edit module / goal';
  }else{
    nameInput.value = '';
    deleteBtn.style.display = 'none';
    document.getElementById('sectionModalTitle').textContent = 'New module / goal';
  }
  updateSwatchSelection(swatches, selectedColor);
  swatches.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      selectedColor = sw.dataset.color;
      updateSwatchSelection(swatches, selectedColor);
    });
  });
  document.getElementById('sectionSave').onclick = ()=>{
    const name = nameInput.value.trim();
    if(!name) return;
    if(editingSectionId){
      const sec = state.sections.find(s=>s.id===editingSectionId);
      sec.name = name; sec.color = selectedColor;
    }else{
      state.sections.push({id: uid(), name, color: selectedColor, collapsed:false, tasks:[]});
    }
    closeSectionModal();
    save();
  };
  deleteBtn.onclick = ()=>{
    if(!confirm('Delete this module and all its tasks?')) return;
    state.sections = state.sections.filter(s=>s.id!==editingSectionId);
    closeSectionModal();
    save();
  };
  overlay.classList.add('open');
}
function updateSwatchSelection(container, color){
  container.querySelectorAll('.swatch').forEach(sw=>{
    sw.classList.toggle('selected', sw.dataset.color === color);
  });
}
function closeSectionModal(){
  document.getElementById('sectionOverlay').classList.remove('open');
  editingSectionId = null;
}
document.getElementById('sectionCancel').addEventListener('click', closeSectionModal);
document.getElementById('fabAdd').addEventListener('click', ()=>openSectionModal(null));

// ---- Task modal ----
function openTaskModal(secId, taskId){
  editingTask = {sectionId: secId, taskId};
  const overlay = document.getElementById('taskOverlay');
  const titleInput = document.getElementById('taskTitle');
  const deadlineInput = document.getElementById('taskDeadline');
  const notesInput = document.getElementById('taskNotes');
  const deleteBtn = document.getElementById('taskDelete');
  const prioButtons = document.querySelectorAll('#taskPriority button');

  let selectedPriority = 'med';
  if(taskId){
    const sec = state.sections.find(s=>s.id===secId);
    const t = sec.tasks.find(t=>t.id===taskId);
    titleInput.value = t.title;
    deadlineInput.value = t.deadline || '';
    notesInput.value = t.notes || '';
    selectedPriority = t.priority || 'med';
    deleteBtn.style.display = 'block';
    document.getElementById('taskModalTitle').textContent = 'Edit task';
  }else{
    titleInput.value = '';
    deadlineInput.value = '';
    notesInput.value = '';
    deleteBtn.style.display = 'none';
    document.getElementById('taskModalTitle').textContent = 'New task';
  }
  prioButtons.forEach(b=>b.classList.toggle('selected', b.dataset.p === selectedPriority));
  prioButtons.forEach(b=>{
    b.onclick = ()=>{
      selectedPriority = b.dataset.p;
      prioButtons.forEach(x=>x.classList.toggle('selected', x===b));
    };
  });

  document.getElementById('taskSave').onclick = ()=>{
    const title = titleInput.value.trim();
    if(!title) return;
    const sec = state.sections.find(s=>s.id===secId);
    if(taskId){
      const t = sec.tasks.find(t=>t.id===taskId);
      t.title = title; t.deadline = deadlineInput.value || null;
      t.notes = notesInput.value; t.priority = selectedPriority;
    }else{
      sec.tasks.push({
        id: uid(), title, deadline: deadlineInput.value || null,
        notes: notesInput.value, priority: selectedPriority,
        done:false, subtasks:[]
      });
    }
    closeTaskModal();
    save();
  };
  deleteBtn.onclick = ()=>{
    if(!confirm('Delete this task?')) return;
    const sec = state.sections.find(s=>s.id===secId);
    sec.tasks = sec.tasks.filter(t=>t.id!==taskId);
    closeTaskModal();
    save();
  };
  overlay.classList.add('open');
}
function closeTaskModal(){
  document.getElementById('taskOverlay').classList.remove('open');
  editingTask = null;
}
document.getElementById('taskCancel').addEventListener('click', closeTaskModal);

// ---- Export / Import ----
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `tracker-backup-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.sections) throw new Error('bad format');
      if(state.sections.length && !confirm('This will replace your current data with the imported backup. Continue?')) return;
      state = parsed;
      save();
    }catch(err){
      alert('Could not read that file — is it a Tracker backup JSON?');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// close modals on backdrop click
document.getElementById('sectionOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'sectionOverlay') closeSectionModal();
});
document.getElementById('taskOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'taskOverlay') closeTaskModal();
});

// register service worker
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

render();
</script>
</body>
</html>
